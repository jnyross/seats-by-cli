name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Offline checks
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall seatspy tests scripts
          python -m pytest
      - name: Prove the wheel
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          python -m pip install build
          python -m build
          scripts/check-wheel.sh dist/*.whl
