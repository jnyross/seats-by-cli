name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Offline checks
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall seatspy tests scripts
          python -m pytest
      - name: Prove the wheel
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          python -m pip install build
          python -m build
          scripts/check-wheel.sh dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build and pin the tag
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          python -m pip install build
          python -m build
          scripts/check-wheel.sh dist/*.whl "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
